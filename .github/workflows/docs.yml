name: Docs

# TIde's docs (docs/, Sphinx with the Read the Docs theme), built from main and published
# on GitHub Pages at https://<owner>.github.io/TIde/docs/, beside the stable and nightly web
# versions. Like the web job in build.yml, it replaces only its own part of the site (docs/) in the
# gh-pages branch and publishes the whole branch, so the web versions stay as they are.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    name: Docs (GitHub Pages)
    runs-on: ubuntu-latest
    # One Pages deploy at a time, with build.yml's web job, so none overwrites another's part.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}docs/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # -W: a warning fails the build, as on Read the Docs (.readthedocs.yaml).
      - name: Build the docs
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Put the docs in their place in the site, and commit the site to gh-pages
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          # The site as it is: the stable and nightly web versions. (None yet, the first time.)
          git clone -q --depth 1 --branch gh-pages "$REMOTE" site 2>/dev/null || mkdir site
          rm -rf site/.git site/docs
          mkdir -p site/docs
          cp -a docs/_build/html/. site/docs/
          cd site
          # Served as files, not through Jekyll (which would drop Sphinx's _static and _sources).
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "TIde docs, built from ${GITHUB_SHA::7}"
          git push -q --force "$REMOTE" gh-pages
          rm -rf .git
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
