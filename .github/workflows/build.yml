name: Build

# Two kinds of release:
# - every push to main refreshes the rolling "latest" prerelease (installers only, no latest.json);
# - a version tag (v1.5.0) builds that version as a stable release, with latest.json, which installed
#   apps read to update. The app checks releases/latest/download/latest.json: the newest stable release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false # every commit finishes and publishes, in order

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.start.outputs.started }}
      version: ${{ steps.start.outputs.version }}
      release: ${{ steps.start.outputs.release }}
      stable: ${{ steps.start.outputs.stable }}

    steps:
      - uses: actions/checkout@v4

      - name: Note the start time and version, and create the release if it doesn't exist
        id: start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # The version is the one in tauri.conf.json. Installed apps update when it goes up.
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::The tag $tag doesn't match the version in tauri.conf.json ($version)."
              exit 1
            fi
            echo "release=$tag" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            # A draft until every platform has built, so nobody gets half a release.
            if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$REPO" --verify-tag --draft \
                --title "TIde $tag" --notes "Building TIde $version…"
            fi
          else
            echo "release=latest" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            if ! gh release view latest --repo "$REPO" >/dev/null 2>&1; then
              gh release create latest --repo "$REPO" \
                --title "Latest Build" \
                --notes "Latest automated build from commit $SHA" \
                --target "$SHA" --prerelease
            fi
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            target: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            target: ""
          - name: MacOS (Apple Silicon)
            os: macos-15
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: MacOS (Intel)
            os: macos-15
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm's download cache, shared by every version: package-lock.json changes with each version
      # bump, so a build restores the newest cache from any earlier version and only fetches what's new.
      - name: Find npm's cache folder
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Compiled Rust dependencies, shared by every version: one cache per platform and target,
      # restored by its name alone when the dependencies change, and saved even when a build fails.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: tide-${{ matrix.target || runner.os }}
          cache-on-failure: true

      - run: npm ci

      - name: Set this build's version and turn on signed update files
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}' "$VERSION" > src-tauri/tauri.ci.conf.json

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json

      - name: Upload installers to the release
        shell: bash   # the default on Windows is PowerShell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE: ${{ needs.prepare.outputs.release }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$VERSION"
          extras=src-tauri/target/release-extras
          mkdir -p "$extras"

          # The exe has the frontend built in, so it runs on its own without an installer.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/tide.exe "$extras/TIde_${version}_x64-portable.exe"
          fi

          # A .app is a folder, so it has to be zipped to upload. ditto keeps its symlinks and permissions.
          if [ "$RUNNER_OS" = "macOS" ]; then
            case "$TARGET" in
              aarch64-*) arch=aarch64 ;;
              *) arch=x64 ;;
            esac
            bundle="src-tauri/target/$TARGET/release/bundle/macos"
            ditto -c -k --keepParent "$bundle/TIde.app" "$extras/TIde_${version}_${arch}.app.zip"
            # The updater's archive has the same name on both Macs, so give it the version and architecture.
            cp "$bundle/TIde.app.tar.gz" "$extras/TIde_${version}_${arch}.app.tar.gz"
            cp "$bundle/TIde.app.tar.gz.sig" "$extras/TIde_${version}_${arch}.app.tar.gz.sig"
          fi

          files=(
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/*/*.sig
            "$extras"/*
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found under src-tauri/target"
            find src-tauri/target -path '*/bundle/*' -type f || true
            exit 1
          fi
          printf 'Uploading: %s\n' "${files[@]}"
          gh release upload "$RELEASE" "${files[@]}" --repo "$REPO" --clobber

  web:
    name: Web version (GitHub Pages)
    # Each stable release also publishes TIde's web version, at https://<owner>.github.io/TIde/.
    if: needs.prepare.outputs.stable == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The C compiler is too big for the repository: it comes from the web-toolchain release
      # (the Web toolchain workflow builds it). Without it, the site builds everything but C.
      - name: Get ez80-clang
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p toolchain/clang/dist
          gh release download web-toolchain --repo "${{ github.repository }}" --pattern "clang.*" --dir toolchain/clang/dist             || echo "::warning::No web-toolchain release yet, so the web version can't compile C. Run the Web toolchain workflow."
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deploy
        uses: actions/deploy-pages@v4

  finish:
    name: Finish release
    # Runs only if every platform built, so a failed build keeps that platform's old installers.
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the history to move the "latest" tag safely

      - name: Rolling build - move the tag, refresh the prerelease, clear stale assets
        if: needs.prepare.outputs.stable != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STARTED: ${{ needs.prepare.outputs.started }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$SHA"
          git push -f origin refs/tags/latest

          printf '%s\n\n---\nTIde %s, built from commit %s. A rolling build of main: installed apps update from tagged releases, not this one.\n' \
            "$(cat RELEASE_NOTES.md)" "$VERSION" "$SHA" > body.md
          gh release edit latest --repo "$REPO" --title "TIde v$VERSION (latest build)" --notes-file body.md --prerelease

          # Anything not uploaded by this run is left over from an older build, latest.json included:
          # only tagged releases have one.
          gh release view latest --repo "$REPO" --json assets \
            | jq -r --arg started "$STARTED" '.assets[] | select(.updatedAt < $started or .name == "latest.json") | .name' \
            | while IFS= read -r asset; do
                [ -z "$asset" ] && continue
                echo "Removing stale asset: $asset"
                gh release delete-asset latest "$asset" --repo "$REPO" --yes
              done

      - name: Tagged release - notes, latest.json, publish
        if: needs.prepare.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          set -euo pipefail
          # The release text is RELEASE_NOTES.md, which the app also shows when it offers the update.
          printf '%s\n\n---\nTIde %s, built from commit %s.\n' "$(cat RELEASE_NOTES.md)" "$VERSION" "$SHA" > body.md

          # latest.json tells installed apps about this version: one signed download per platform,
          # from this release.
          mkdir -p sigs
          gh release download "$RELEASE" --repo "$REPO" --pattern "*_${VERSION}_*.sig" --dir sigs
          node -e '
            const fs = require("fs");
            const kinds = [[/_x64-setup\.exe\.sig$/, "windows-x86_64"], [/_aarch64\.app\.tar\.gz\.sig$/, "darwin-aarch64"],
                           [/_x64\.app\.tar\.gz\.sig$/, "darwin-x86_64"], [/_amd64\.AppImage\.sig$/, "linux-x86_64"]];
            const platforms = {};
            for (const file of fs.readdirSync("sigs")) {
              const kind = kinds.find(([re]) => re.test(file));
              if (!kind) continue;
              platforms[kind[1]] = {
                signature: fs.readFileSync("sigs/" + file, "utf8").trim(),
                url: `https://github.com/${process.env.REPO}/releases/download/${process.env.RELEASE}/${file.slice(0, -4)}`,
              };
            }
            if (Object.keys(platforms).length < kinds.length) console.log("::warning::latest.json covers only " + Object.keys(platforms).join(", "));
            const notes = fs.readFileSync("RELEASE_NOTES.md", "utf8").trim();
            fs.writeFileSync("latest.json", JSON.stringify({ version: process.env.VERSION, notes, pub_date: new Date().toISOString(), platforms }, null, 2));
          '
          gh release upload "$RELEASE" latest.json --repo "$REPO" --clobber
          gh release edit "$RELEASE" --repo "$REPO" --title "TIde $RELEASE" --notes-file body.md --draft=false --latest
