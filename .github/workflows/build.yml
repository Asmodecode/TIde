name: Build

# Three kinds of release:
# - every push to main refreshes the rolling "latest" prerelease: a nightly build, versioned as the
#   next patch with the run number (2.0.1-75: above 2.0.0, below 2.0.1), with nightly.json, which
#   installed apps on the Nightly update channel read (releases/download/latest/nightly.json);
# - a version tag (v1.5.0) builds that version as a stable release, with latest.json, which installed
#   apps on the Stable channel read: releases/latest/download/latest.json, the newest stable release.
# The web version has a stable and a nightly too, each at its own address (see the web job).
# - a web version tag (v1.6.1-web) builds and publishes only the web version: no installers, and its
#   release is never marked latest, so installed apps keep updating from the last stable release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false # every commit finishes and publishes, in order

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.start.outputs.started }}
      version: ${{ steps.start.outputs.version }}
      release: ${{ steps.start.outputs.release }}
      stable: ${{ steps.start.outputs.stable }}
      web: ${{ steps.start.outputs.web }}

    steps:
      - uses: actions/checkout@v4

      - name: Note the start time and version, and create the release if it doesn't exist
        id: start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # The version is the one in tauri.conf.json. Installed apps update when it goes up.
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v*-web ]]; then
            # The web version alone: its own version, from the tag, and nothing for the installed apps.
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release=$tag" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              notes="$(cat WEB_RELEASE_NOTES.md 2>/dev/null || echo "TIde's web version, $version.")"
              gh release create "$tag" --repo "$REPO" --verify-tag --latest=false \
                --title "TIde $version" --notes "$notes"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::The tag $tag doesn't match the version in tauri.conf.json ($version)."
              exit 1
            fi
            echo "release=$tag" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            # A draft until every platform has built, so nobody gets half a release.
            if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$REPO" --verify-tag --draft \
                --title "TIde $tag" --notes "Building TIde $version…"
            fi
          else
            # A nightly: the next patch version, with this run's number after it. Windows' MSI takes
            # only a number there, of at most 65535.
            IFS=. read -r major minor patch <<< "${version%%-*}"
            version="$major.$minor.$((patch + 1))-$GITHUB_RUN_NUMBER"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release=latest" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            if ! gh release view latest --repo "$REPO" >/dev/null 2>&1; then
              gh release create latest --repo "$REPO" \
                --title "Latest Build" \
                --notes "Latest automated build from commit $SHA" \
                --target "$SHA" --prerelease
            fi
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    # A web version tag builds no installers.
    if: needs.prepare.outputs.web != 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            target: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            target: ""
          - name: MacOS (Apple Silicon)
            os: macos-15
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: MacOS (Intel)
            os: macos-15
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libudev-dev # for serial ports (the serialport crate)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm's download cache, shared by every version: package-lock.json changes with each version
      # bump, so a build restores the newest cache from any earlier version and only fetches what's new.
      - name: Find npm's cache folder
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Compiled Rust dependencies, shared by every version: one cache per platform and target,
      # restored by its name alone when the dependencies change, and saved even when a build fails.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: tide-${{ matrix.target || runner.os }}
          cache-on-failure: true

      - run: npm ci

      - name: Set this build's version and turn on signed update files
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}' "$VERSION" > src-tauri/tauri.ci.conf.json

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # A nightly's version has a dash (2.0.2-48), which an .rpm can't have: Linux nightlies are the
          # .deb and the AppImage (what the Nightly channel updates from). Releases build all three.
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json ${{ needs.prepare.outputs.stable != 'true' && runner.os == 'Linux' && '--bundles deb,appimage' || '' }}

      - name: Upload installers to the release
        shell: bash   # the default on Windows is PowerShell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE: ${{ needs.prepare.outputs.release }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$VERSION"
          extras=src-tauri/target/release-extras
          mkdir -p "$extras"

          # The exe has the frontend built in, so it runs on its own without an installer.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/tide.exe "$extras/TIde_${version}_x64-portable.exe"
          fi

          # A .app is a folder, so it has to be zipped to upload. ditto keeps its symlinks and permissions.
          if [ "$RUNNER_OS" = "macOS" ]; then
            case "$TARGET" in
              aarch64-*) arch=aarch64 ;;
              *) arch=x64 ;;
            esac
            bundle="src-tauri/target/$TARGET/release/bundle/macos"
            ditto -c -k --keepParent "$bundle/TIde.app" "$extras/TIde_${version}_${arch}.app.zip"
            # The updater's archive has the same name on both Macs, so give it the version and architecture.
            cp "$bundle/TIde.app.tar.gz" "$extras/TIde_${version}_${arch}.app.tar.gz"
            cp "$bundle/TIde.app.tar.gz.sig" "$extras/TIde_${version}_${arch}.app.tar.gz.sig"
          fi

          files=(
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/*/*.sig
            "$extras"/*
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found under src-tauri/target"
            find src-tauri/target -path '*/bundle/*' -type f || true
            exit 1
          fi
          printf 'Uploading: %s\n' "${files[@]}"
          gh release upload "$RELEASE" "${files[@]}" --repo "$REPO" --clobber

  web:
    name: Web version (GitHub Pages)
    # TIde's web version, on GitHub Pages (Settings > Pages > Deploy from branch: gh-pages), in two places:
    # - stable, at https://<owner>.github.io/TIde/, from each stable release (and web version tag);
    # - nightly, at https://<owner>.github.io/TIde/nightly/, from every push to main;
    # and the docs at https://<owner>.github.io/TIde/docs/, from main (docs.yml).
    # The gh-pages branch holds the whole site, both builds, JavaScript and WebAssembly included,
    # as one commit: each deploy replaces only its own part (nightly/, docs/, or everything else)
    # and force-pushes, so old builds' large files don't pile up. Pages then publishes the branch's tree.
    needs: prepare
    runs-on: ubuntu-latest
    # One deploy at a time, so a stable and a nightly never overwrite each other's half of the site.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CHANNEL: ${{ (needs.prepare.outputs.stable == 'true' || needs.prepare.outputs.web == 'true') && 'stable' || 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The C compiler (ez80-clang for WebAssembly) is in the repository, in toolchain/clang/dist.
      - name: Check ez80-clang is there
        run: |
          if [ ! -s toolchain/clang/dist/clang.wasm ] || [ ! -s toolchain/clang/dist/clang.js ]; then
            echo "::warning::toolchain/clang/dist has no clang.js and clang.wasm, so the web version can't compile C."
          fi
      - name: Build the web version
        run: |
          if [ "$CHANNEL" = nightly ]; then export TIDE_WEB_BASE=/TIde/nightly/; fi
          npm run build:web
      - name: Put this build in its place in the site, and commit the site to gh-pages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          # The site as it is: both builds. (None yet, the first time.)
          git clone -q --depth 1 --branch gh-pages "$REMOTE" site 2>/dev/null || mkdir site
          rm -rf site/.git
          if [ "$CHANNEL" = stable ]; then
            # Everything but nightly/ and docs/ (the docs workflow's) is the stable build's.
            find site -mindepth 1 -maxdepth 1 ! -name nightly ! -name docs -exec rm -rf {} +
            cp -a dist-web/. site/
          else
            rm -rf site/nightly
            mkdir -p site/nightly
            cp -a dist-web/. site/nightly/
          fi
          cd site
          # GitHub refuses files over 100 MB; one that big is left out, with a warning, rather than failing the push.
          while IFS= read -r big; do
            echo "::warning::Left $big out of gh-pages: GitHub doesn't take files over 100 MB."
            rm -f "$big"
          done < <(find . -type f -size +95M)
          # Served as files, not through Jekyll (which would drop anything starting with "_").
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "TIde $VERSION web version ($CHANNEL), built from ${GITHUB_SHA::7}"
          git push -q --force "$REMOTE" gh-pages
          rm -rf .git
  finish:
    name: Finish release
    # Runs only if every platform built, so a failed build keeps that platform's old installers.
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the history to move the "latest" tag safely

      - name: Rolling build - move the tag, refresh the prerelease, clear stale assets
        if: needs.prepare.outputs.stable != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STARTED: ${{ needs.prepare.outputs.started }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$SHA"
          git push -f origin refs/tags/latest

          printf '%s\n\n---\nTIde %s, a nightly build of main, from commit %s. Installed apps on the Nightly update channel (Settings → Updates) update to it; the Stable channel updates from tagged releases.\n' \
            "$(cat RELEASE_NOTES.md)" "$VERSION" "$SHA" > body.md
          gh release edit latest --repo "$REPO" --title "TIde v$VERSION (latest build)" --notes-file body.md --prerelease

          # Anything not uploaded by this run is left over from an older build, latest.json included
          # (only tagged releases have one) and the last nightly.json, written again below.
          gh release view latest --repo "$REPO" --json assets \
            | jq -r --arg started "$STARTED" '.assets[] | select(.updatedAt < $started or .name == "latest.json" or .name == "nightly.json") | .name' \
            | while IFS= read -r asset; do
                [ -z "$asset" ] && continue
                echo "Removing stale asset: $asset"
                gh release delete-asset latest "$asset" --repo "$REPO" --yes
              done

          # nightly.json: what the Nightly channel installs, this build. Its notes are the commit's.
          mkdir -p sigs
          gh release download latest --repo "$REPO" --pattern "*_${VERSION}_*.sig" --dir sigs
          { echo "Nightly build $VERSION, from commit ${SHA::7}:"; echo; git log -1 --format='%s%n%n%b' "$SHA"; } > nightly-notes.md
          node .github/update-manifest.cjs sigs latest "$VERSION" nightly-notes.md nightly.json
          gh release upload latest nightly.json --repo "$REPO" --clobber

      - name: Tagged release - notes, latest.json, publish
        if: needs.prepare.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          set -euo pipefail
          # The release text is RELEASE_NOTES.md, which the app also shows when it offers the update.
          printf '%s\n\n---\nTIde %s, built from commit %s.\n' "$(cat RELEASE_NOTES.md)" "$VERSION" "$SHA" > body.md

          # latest.json tells installed apps about this version: one signed download per platform,
          # from this release.
          mkdir -p sigs
          gh release download "$RELEASE" --repo "$REPO" --pattern "*_${VERSION}_*.sig" --dir sigs
          node .github/update-manifest.cjs sigs "$RELEASE" "$VERSION" RELEASE_NOTES.md latest.json
          gh release upload "$RELEASE" latest.json --repo "$REPO" --clobber
          gh release edit "$RELEASE" --repo "$REPO" --title "TIde $RELEASE" --notes-file body.md --draft=false --latest
